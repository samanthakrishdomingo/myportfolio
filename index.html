<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Name • Welcome</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #ec4899;           
      --primary-dark: #db2777;      
      --text: #1f2937;
      --text-light: #4b5563;
      --bg: #ffffff;
      --light: #fdf2f8;             
      --soft-pink: #fce7f3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(236, 72, 153, 0.12);
      transition: all 0.3s;
    }

    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5%;
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
    }

    .hero-content {
      max-width: 900px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(3.2rem, 8vw, 5.5rem);
      margin-bottom: 1.5rem;
      line-height: 1.1;
      font-weight: 800;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      font-size: 1.35rem;
      color: var(--text-light);
      margin-bottom: 2.5rem;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.2rem;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.25);
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(236, 72, 153, 0.35);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      margin-left: 1.2rem;
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    .scroll-down {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      color: var(--primary);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
      40% { transform: translate(-50%, -15px); }
      60% { transform: translate(-50%, -8px); }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none; 
      }
      
      .hero h1 {
        font-size: clamp(2.8rem, 10vw, 4.2rem);
      }
      
      .hero p {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#" class="logo">MY HOMEPAGE</a>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Hi, I'm <span>Samm</span></h1>
      <p>Explore About Me!</p>
      
      <div>
        <a href="signup.html" class="btn">Sign Up</a>
        <a href="login.html" class="btn btn-outline">log In</a>
      </div>
    </div>

    <div class="scroll-down">
      <i class="fa-solid fa-chevron-down"></i>
    </div>
  </section>

</body>

</html>
